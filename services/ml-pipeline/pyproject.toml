[project]
name = "dataforge-ml-pipeline"
version = "0.1.0"
description = "DataForge ML Quality Validation Pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "confluent-kafka>=2.6.0",
    "pydantic>=2.10.0",
    "boto3>=1.36.0",
    "pymongo>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "black>=25.1.0",
    "mypy>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]
